[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dsai"
version = "0.1.0"
description = "电商数据分析 Agent - 五层架构 NL-to-SQL 系统"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "duckdb>=1.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "openai>=1.0",
    "langfuse>=3.0",
    "jsonschema>=4.0",
    "sqlglot>=25.0",
    "jinja2>=3.0",
    "chromadb>=1.0",
    "python-dateutil>=2.9",
    "tiktoken>=0.7",
    "langgraph>=1.0",
    "plotly>=5.0",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
all = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "datagen*", "eval*", "orchestration*", "compile*", "retrieval*", "tools*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
